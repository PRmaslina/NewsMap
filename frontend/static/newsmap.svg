<?xml version="1.0" encoding="utf-8"?>
<svg width="256px" height="256px" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  
<defs>
    <!-- Маска по форме вашего пина, чтобы линии глобуса не вылезали наружу -->
    <clipPath id="pin-clip">
      <path d="M 200 15 
               C 50 20, 50 150, 50 170 
               C 50 280, 200 320, 200 380 
               C 200 320, 350 280, 350 170 
               C 350 150, 350 20, 200 15 Z" />
    </clipPath>
  </defs>

  <!-- Ваш исходный пин -->
  <path d="M 200 15 
           C 40 20, 30 150, 30 170 
           C 30 280, 120 340, 200 390 
           C 280 340, 370 280, 370 170 
           C 370 150, 360 20, 200 15 Z" 
        fill="#37a7d9" 
        stroke="#3737ff" 
        stroke-width="5" />

  <!-- Глобус (Линии сделаны толще: stroke-width="8") -->
  <g clip-path="url(#pin-clip)" fill="none" stroke="white" stroke-width="25" stroke-linecap="round">
    <!-- Внешний контур сферы (радиус 100) -->
    <circle cx="200" cy="180" r="110" />
    
    <!-- Меридиан 1 (измененный rx="50" из вашего запроса) -->
    <ellipse cx="200" cy="180" rx="50" ry="110" />

    <line x1="90" y1="180" x2="290" y2="180" />

    <!-- Верхняя параллель 
    <path d="M 105 130 Q 200 155 295 130" /> -->

    <!-- Нижняя параллель
    <path d="M 105 230 Q 200 195 295 230" /> -->
  </g>

</svg>
